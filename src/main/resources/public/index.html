<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login tableros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>

    <div class="container is-max-tablet">

        <section class="section is-small">
            <div class="container">
                <h1 class="title">
                    Login App Tableros
                </h1>
                <p class="subtitle">
                    Iniciar sesión
                </p>
            </div>
        </section>

        <div class="notification is-light is-hidden" id="notificationDiv">
            <button class="delete"></button>
            <p id="notificationMessage">lalllalla</p>
        </div>

        <section class="section is-medium">

            <div class="field">
                <label class="label">Usuario</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Mi Usuario" id="user">
                </div>
            </div>

            <div class="field">
                <label class="label">Contraseña</label>
                <div class="control">
                    <input class="input" type="password" placeholder="Contraseña" id="password">
                </div>
            </div>

            <div class="field is-grouped">
                <div class="control">
                    <button class="button is-primary" id="submitBtn">Iniciar Sesión</button>
                </div>
            </div>
        </section>

    </div>


</body>
<script src="js/app.js">
</script>

</html>
